name: schedule smoke test

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Show trigger information
        run: |
          echo "schedule smoke test"
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "ref=${{ github.ref }}"
          echo "repository=${{ github.repository }}"
          date -u
